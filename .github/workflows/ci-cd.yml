name: Secure Hello World CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Build static website
        run: python3 scripts/build.py

      - name: Verify build artifact
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          grep -q 'Hello, World!' dist/index.html

      - name: Upload build for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  test:
    name: Test + Security Checks
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Run unit and security configuration tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan source for accidentally committed secrets
        run: python3 scripts/security_scan.py

  deploy:
    name: Deploy
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
